---
# Skip docs and notes; nothing to analyze.
# Java glob syntax: "**/*.md" needs a directory, so root-level files
# (CLAUDE.md, README.md) need "*.md" / "**.md". Codacy reads this file
# from the default branch, so it takes effect once merged to main.
exclude_paths:
  - "docs/**"
  - "*.md"
  - "**.md"
  - "Claude outputs/**"
  - "js/vendor/**"
