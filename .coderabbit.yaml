language: en-US

reviews:
  # Drafts are for work in progress; review only when marked ready.
  auto_review:
    drafts: false
  # Skip docs and notes: no code to review.
  path_filters:
    - "!docs/**"
    - "!**/*.md"
    - "!Claude outputs/**"
  path_instructions:
    - path: "server/**"
      instructions: |
        This is the new self-hosted backend, built in small PRs as part of a
        phased migration off Supabase (see docs/backend-migration-spec.md).
        Do NOT flag unfinished-feature warnings such as unused exports or
        routes that a later phase will connect.
        DO check the security rules strictly:
        - every endpoint has a clear caller (session or device token)
        - authorization never trusts a client-supplied household id
        - one-time secrets (pairing codes) are consumed atomically before any
          credential is issued
        - tokens and secrets never appear in URLs, logs or error messages
        - the database port is never exposed publicly
        - schema changes are migration files, never ad-hoc SQL
    - path: "js/**"
      instructions: |
        Vanilla JS, no framework or bundler. All interpolated data must go
        through escapeHtml() before innerHTML. Frontend data calls are moving
        behind a BACKEND=supabase|api adapter; the unused branch is expected.
