<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0">
  <title>Homeboard Sign Up</title>
  <link rel="stylesheet" href="css/tokens.css?v=2.5.30">
  <style>
    :root {
      --radius-lg: 28px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --button-radius: 8px;
      --tag-radius: 12px;
      --transition: 560ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    img.brand-logo--dark { display: none; }
    @media (prefers-color-scheme: dark) {
      img.brand-logo--light { display: none; }
      img.brand-logo--dark { display: block; }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    .signup-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .signup-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 32px 24px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
    }

    .admin-login-brand {
      display: flex;
      justify-content: center;
    }

    .admin-login-logo {
      display: block;
      width: 160px;
      max-width: 100%;
      height: auto;
    }

    .signup-copy {
      display: grid;
      gap: 8px;
    }

    .signup-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 6vw, 2.1rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .signup-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .admin-field {
      display: grid;
      gap: 6px;
    }

    .admin-field label {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--muted);
    }

    .admin-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }

    .admin-input::placeholder {
      color: var(--muted);
    }

    .admin-input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-color: var(--primary);
    }

    .signup-code-input {
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .signup-code-input::placeholder {
      letter-spacing: normal;
      text-transform: none;
    }

    .admin-login-error {
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      border-radius: var(--button-radius);
      color: var(--danger);
      font-size: 0.82rem;
      padding: 10px 12px;
      line-height: 1.45;
    }

    .admin-button {
      border: 0;
      border-radius: var(--button-radius);
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease, background-color 140ms ease;
    }

    .admin-button:hover,
    .admin-button:focus-visible {
      transform: translateY(-1px);
    }

    .admin-button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--surface);
    }

    .admin-button:disabled {
      cursor: wait;
      opacity: 0.6;
      transform: none;
    }

    .admin-button--primary {
      background: var(--primary);
      color: var(--on-primary);
    }

    .signup-submit {
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    .signup-version {
      margin-top: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      opacity: 0.62;
      text-align: center;
      text-transform: none;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 480px) {
      .signup-card {
        padding: 28px 20px 24px;
      }

      .signup-submit {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="signup-screen">
    <section class="signup-card" aria-labelledby="signup-title">
      <div class="admin-login-brand" aria-label="Homeboard">
        <img class="brand-logo brand-logo--light admin-login-logo" src="brand/logo-stacked.svg" alt="Homeboard" width="160" decoding="async"><img class="brand-logo brand-logo--dark admin-login-logo" src="brand/logo-stacked-on-dark.svg" alt="" width="160" decoding="async">
      </div>
      <div class="signup-copy">
        <h1 class="signup-title" id="signup-title">Create your household</h1>
        <p class="signup-note">Use your invite code to set up your Homeboard account and jump straight into Admin Mode.</p>
      </div>
      <form class="signup-form" id="signup-form" novalidate>
        <div class="admin-field">
          <label for="invite-code">Invite code</label>
          <input
            id="invite-code"
            class="admin-input signup-code-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Enter your invite code"
            required
          >
        </div>
        <div class="admin-field">
          <label for="display-name">Your name</label>
          <input
            id="display-name"
            class="admin-input"
            type="text"
            autocomplete="name"
            placeholder="Your first name"
            required
          >
        </div>
        <div class="admin-field">
          <label for="email">Email</label>
          <input
            id="email"
            class="admin-input"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>
        <div class="admin-field">
          <label for="password">Password</label>
          <input
            id="password"
            class="admin-input"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="At least 8 characters"
            required
          >
        </div>
        <div class="admin-login-error" id="signup-error" hidden role="alert"></div>
        <button class="admin-button admin-button--primary signup-submit" id="signup-submit" type="submit">Create account</button>
        <div class="signup-version" id="signup-version" aria-hidden="true"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer crossorigin="anonymous"></script>
  <script>
    const SUPABASE_URL = "%%SUPABASE_URL%%";
    const SUPABASE_KEY = "%%SUPABASE_KEY%%";
    const VERSION = "2.0.17";
    const pathname = window.location.pathname.replace(/\/+$/, "") || "/";
    const isAuthMode = pathname === "/admin" || pathname === "/signup";
    let sb = null;

    function initSupabaseClient() {
      if (sb) {
        return sb;
      }

      if (!window.supabase || typeof window.supabase.createClient !== "function") {
        return null;
      }

      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            persistSession: isAuthMode,
            autoRefreshToken: isAuthMode,
            detectSessionInUrl: isAuthMode
          }
        });
      } catch (error) {
        console.warn("Supabase unavailable during signup.", error);
      }

      return sb;
    }

    function getSupabaseClient() {
      return sb || initSupabaseClient();
    }

    function normalizeInviteCode(value) {
      return String(value || "").trim().toUpperCase();
    }

    function showError(message) {
      const errorEl = document.getElementById("signup-error");
      if (!errorEl) {
        return;
      }

      errorEl.textContent = message;
      errorEl.hidden = false;
    }

    function clearError() {
      const errorEl = document.getElementById("signup-error");
      if (!errorEl) {
        return;
      }

      errorEl.hidden = true;
      errorEl.textContent = "";
    }

    function setSubmitting(isSubmitting) {
      const submitButton = document.getElementById("signup-submit");
      if (!submitButton) {
        return;
      }

      submitButton.disabled = isSubmitting;
      submitButton.textContent = isSubmitting ? "Creating account…" : "Create account";
    }

    function mapSignupError(error) {
      const message = String(error?.message || "").toLowerCase();
      if (message.includes("user already registered")) {
        return "An account with that email already exists.";
      }
      if (message.includes("password should be at least 6 characters")) {
        return "Please choose a password at least 8 characters long.";
      }
      return "Something went wrong. Please try again.";
    }

    async function checkInviteCode(client, code) {
      const { data, error } = await client.rpc("check_invite_code", { p_code: code });

      if (error) {
        throw error;
      }

      return data === true;
    }

    async function createHousehold(accessToken, displayName, inviteCode) {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/create-household-on-signup`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ display_name: displayName, invite_code: inviteCode })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => null);
        const failure = new Error("create-household-failed");
        failure.inviteCodeRejected = data?.error === "invalid_invite_code";
        throw failure;
      }
    }

    function prefillInviteCodeFromUrl() {
      const inviteInput = document.getElementById("invite-code");
      if (!inviteInput) {
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const code = normalizeInviteCode(params.get("code"));
      if (code) {
        inviteInput.value = code;
      }
    }

    function initErrorReset() {
      const fields = Array.from(document.querySelectorAll("#signup-form input"));
      fields.forEach((field) => {
        field.addEventListener("input", () => {
          if (field.id === "invite-code") {
            const start = field.selectionStart;
            const end = field.selectionEnd;
            field.value = normalizeInviteCode(field.value);
            if (typeof start === "number" && typeof end === "number") {
              field.setSelectionRange(start, end);
            }
          }
          clearError();
        });
      });
    }

    async function handleSignupSubmit(event) {
      event.preventDefault();
      clearError();

      const client = getSupabaseClient();
      if (!client) {
        showError("Something went wrong. Please try again.");
        return;
      }

      const inviteInput = document.getElementById("invite-code");
      const nameInput = document.getElementById("display-name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      const inviteCode = normalizeInviteCode(inviteInput?.value);
      const displayName = String(nameInput?.value || "").trim();
      const email = String(emailInput?.value || "").trim();
      const password = String(passwordInput?.value || "");

      if (inviteInput) {
        inviteInput.value = inviteCode;
      }

      if (!inviteCode || !displayName || !email || !password) {
        showError("Please fill out all fields.");
        return;
      }

      if (password.length < 8) {
        showError("Please choose a password at least 8 characters long.");
        return;
      }

      setSubmitting(true);

      try {
        const inviteCodeIsValid = await checkInviteCode(client, inviteCode);
        if (!inviteCodeIsValid) {
          showError("This invite code isn't valid or has already been used.");
          return;
        }

        const { data, error } = await client.auth.signUp({
          email,
          password
        });

        if (error) {
          showError(mapSignupError(error));
          return;
        }

        const accessToken = data?.session?.access_token;
        if (!accessToken) {
          showError("Something went wrong setting up your household. Please contact support.");
          return;
        }

        try {
          await createHousehold(accessToken, displayName, inviteCode);
        } catch (error) {
          console.error("Household setup failed.", error);
          if (error?.inviteCodeRejected) {
            showError("This invite code isn't valid or has already been used.");
            return;
          }
          showError("Something went wrong setting up your household. Please contact support.");
          return;
        }

        window.location.replace("/admin?onboarding=true");
      } catch (error) {
        console.error("Signup failed.", error);
        showError("Something went wrong. Please try again.");
      } finally {
        setSubmitting(false);
      }
    }

    function initSignupPage() {
      if (window.lucide && typeof window.lucide.createIcons === "function") {
        window.lucide.createIcons();
      }

      const signupVersionEl = document.getElementById("signup-version");
      if (signupVersionEl) {
        signupVersionEl.textContent = `v${VERSION}`;
      }

      prefillInviteCodeFromUrl();
      initErrorReset();

      const form = document.getElementById("signup-form");
      if (form) {
        form.addEventListener("submit", handleSignupSubmit);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initSignupPage, { once: true });
    } else {
      initSignupPage();
    }
  </script>
</body>
</html>
