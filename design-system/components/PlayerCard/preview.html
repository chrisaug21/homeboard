<!-- @dsCard group="Scorecard" height=260 -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-ui)}
.wrap{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
</style></head><body><style>.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}.pc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px}
.lead{border:2px solid var(--time-today)}.hd{display:flex;justify-content:space-between;align-items:center}.who{display:inline-flex;gap:7px;align-items:center;font:800 18px var(--font-display)}.who i{width:11px;height:11px;border-radius:50%}
.tag{display:inline-flex;font:800 11px var(--font-ui);padding:4px 8px;border-radius:8px;background:var(--time-today);color:var(--on-time-today)}
.s{font:800 52px/1 var(--font-display);letter-spacing:-.02em;margin:10px 0 12px}.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.b{border:1px solid var(--border);border-radius:var(--button-radius);text-align:center;padding:10px;font:800 15px var(--font-ui);background:var(--surface)}</style>
<div class=sg><div class=pc><div class=hd><span class=who style="color:var(--person-blueberry)"><i style="background:var(--person-blueberry)"></i>Chris</span></div><div class=s>3,200</div><div class=bg><span class=b>+200</span><span class=b>+600</span><span class=b>+1,000</span></div></div>
<div class="pc lead"><div class=hd><span class=who style="color:var(--person-berry)"><i style="background:var(--person-berry)"></i>Bailey</span><span class=tag>Leading</span></div><div class=s>4,600</div><div class=bg><span class=b>+200</span><span class=b>+600</span><span class=b>+1,000</span></div></div></div></body></html>
