<!-- @dsCard group="Wedding pulse" height=150 -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-ui)}
.wrap{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
</style></head><body><style>.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px}.g{display:flex;justify-content:space-between;align-items:center;border-radius:var(--radius-sm);padding:11px 12px;font:700 14px var(--font-ui)}.g span:last-child{font:800 12px var(--font-ui)}
.att{background:var(--countdown-later)}.att span:last-child{color:var(--success)}.und{background:var(--countdown-later);border-left:var(--time-edge) solid var(--time-today)}
.dec{background:var(--card);opacity:.6;text-decoration:line-through;color:var(--muted)}.pen{background:var(--card);border:1.5px dashed var(--border);color:var(--ink)}.pen span:last-child{color:var(--muted)}</style>
<div class=gg><div class="g att"><span>Liz Weinberg</span><span>2 guests</span></div><div class="g und"><span>Ellen Anadio</span><span>⚠ 1 of 2</span></div><div class="g dec"><span>Kelly Bevins</span><span>Declined</span></div><div class="g pen"><span>Joelle Rosen</span><span>Pending</span></div></div></body></html>
