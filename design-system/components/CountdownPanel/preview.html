<!-- @dsCard group="Time scale" height=300 -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-ui)}
.wrap{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
</style></head><body><style>.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px}
.cp{border-radius:var(--radius-lg);padding:22px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.n{font:800 72px/1 var(--font-display);letter-spacing:-.04em;margin:8px 0}.n span{font:800 12px var(--font-ui);letter-spacing:.08em;margin-left:6px;opacity:.85}
.t{font:800 22px/1.15 var(--font-display)}.d{font:700 14px var(--font-ui);opacity:.85}
.today{background:var(--time-today);color:var(--on-time-today)}.soon{background:var(--countdown-soon);color:#fff}.later{background:var(--countdown-later);color:var(--ink)}.far{background:var(--countdown-far);color:var(--ink);border:1px solid var(--border)}</style>
<div class=row><div class="cp far"><div class=t>Honeymoon in Sonoma</div><div class=n>94<span>DAYS</span></div><div class=d>Saturday, October 10</div></div><div class="cp today"><div class=t>Honeymoon in Sonoma</div><div class=n>Today!</div><div class=d>Saturday, October 10</div></div>
<div class="cp soon"><div class=t>Honeymoon in Sonoma</div><div class=n>2<span>DAYS</span></div><div class=d style="font-size:17px">Saturday, October 10</div></div>
<div class="cp later"><div class=t>Honeymoon in Sonoma</div><div class=n>12<span>DAYS</span></div><div class=d>Saturday, October 10</div></div></div></body></html>
